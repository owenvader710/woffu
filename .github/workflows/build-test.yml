name: WOFFU OS CI

on:
  push:
    branches: [main, dev, "v2/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Save CI minutes on the Free plan: keep only the newest run per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Public CI-only placeholders. No real Supabase credentials are required
      # for compilation, and these are never used for production deployment.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-public-key"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test staging deployment guards
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --test tests/security/stagingSafety.test.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint report (legacy issues do not block build yet)
        continue-on-error: true
        run: npm run lint
